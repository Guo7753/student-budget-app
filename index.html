<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Budget</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./src/app.js"></script>
</head>
<body>
  <main>
    <h1>Student Budget</h1>
    <p>Record everyday expenses and see your monthly total. Data stays in this browser.</p>
    <section aria-labelledby="add-title">
      <h2 id="add-title">Add an expense</h2>
      <form id="expense-form">
        <label>Amount ($)<input name="amount" type="number" min="0.01" step="0.01" required></label>
        <label>Date<input id="date" name="date" type="date" required></label>
        <label>Category<select id="category" name="category" required></select></label>
        <label>Note (optional)<input name="note" type="text" maxlength="100"></label>
        <button type="submit">Save expense</button>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
    </section>
    <section aria-labelledby="history-title">
      <h2 id="history-title">Monthly expenses</h2>
      <label>Month<input id="month" type="month"></label>
      <p class="total">Total: <strong id="total">$0.00</strong></p>
      <ul id="expense-list"></ul>
    </section>
  </main>
</body>
</html>
